<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>2048</h1>
            <div class="score-container">
                <div class="score">Score: <span id="score">0</span></div>
                <div class="best-score">Best: <span id="best-score">0</span></div>
            </div>
        </div>
        <div class="game-container">
            <div id="grid"></div>
        </div>
        <div class="game-controls">
            <button id="new-game">New Game</button>
        </div>
    </div>
    <script src="game.js"></script>
  
  <div id="tutorial-modal" class="modal">
    <div class="modal-content">
      <span class="close-tutorial">&times;</span>
      <h2>2048ゲームチュートリアル</h2>
      <div class="tutorial-section">
        <h3>ゲームの目的</h3>
        <p>同じ数字のタイルを合わせて、2048のタイルを作ることが目標です。</p>
      </div>
      <div class="tutorial-section">
        <h3>操作方法</h3>
        <ul>
          <li>矢印キー（↑、↓、←、→）でタイルを移動</li>
          <li>同じ数字のタイルが衝突すると、数字が2倍になります</li>
          <li>盤面に空きがなくなったらゲームオーバー</li>
        </ul>
      </div>
      <div class="tutorial-section">
        <h3>勝利条件</h3>
        <p>2048のタイルを作ったら勝利！さらに高得点を目指しましょう。</p>
      </div>
      <button id="start-game-btn">ゲームスタート</button>
    </div>
  </div>

</body>
</html>
